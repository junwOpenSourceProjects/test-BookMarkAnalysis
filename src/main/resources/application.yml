spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bookmarks?useSSL=false&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&allowMultiQueries=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 缓存配置
  cache:
    type: caffeine

server:
  port: ${SERVER_PORT:8000}

# Actuator健康检查端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

# 书签解析配置
bookmark:
  # 输入文件路径（支持classpath:前缀或绝对路径）
  input-path: ${BOOKMARK_INPUT_PATH:classpath:wo1261931780/testBookMarkAnalysis/bookmarks/bookmarks.html}
  # 输出文件路径
  output-path: ${BOOKMARK_OUTPUT_PATH:${user.home}/bookmark-output/result.txt}
  # AI 配置（默认使用 VoltAPI，OpenAI Chat Completions 协议）
  ai-api-base-url: ${BOOKMARK_AI_API_BASE_URL:https://voltapi.ai}
  ai-api-key: ${BOOKMARK_AI_API_KEY:sk-b6929494236373e208e06e36cf0a9220b1790d49acd3b2bb505fcc56520dd348}
  ai-model-name: ${BOOKMARK_AI_MODEL_NAME:gpt-5.6-terra}

# 日志配置
logging:
  level:
    wo1261931780: ${LOG_LEVEL:INFO}
    org.springframework.cache: ${CACHE_LOG_LEVEL:DEBUG}
